<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JPDCL Bill Calculator</title>

<link rel="manifest" href="manifest.json">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f2027,
        #203a43,
        #2c5364
    );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    overflow:auto;

    position:relative;
}

.bg-glow{

    position:absolute;

    width:300px;

    height:300px;

    background:rgba(0,255,255,0.15);

    border-radius:50%;

    filter:blur(80px);

    top:-100px;

    right:-100px;
}

.container{

    width:100%;

    max-width:650px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:24px;

    padding:25px;

    box-shadow:0 8px 32px rgba(0,0,0,0.35);

    z-index:2;
}

.title{

    text-align:center;

    color:white;

    font-size:30px;

    margin-bottom:8px;
}

.subtitle{

    text-align:center;

    color:#dbeafe;

    margin-bottom:25px;

    font-size:14px;
}

/* CONNECTION TYPE */

.connection-screen{

    text-align:center;

    color:white;
}

.connection-heading{

    font-size:21px;

    margin-bottom:20px;
}

.connection-options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

.connection-btn{

    border:1px solid rgba(255,255,255,0.18);

    background:rgba(255,255,255,0.10);

    color:white;

    border-radius:18px;

    padding:25px 15px;

    cursor:pointer;

    transition:0.3s;

    box-shadow:none;
}

.connection-btn:hover{

    transform:translateY(-4px);

    background:rgba(255,255,255,0.18);

    box-shadow:0 10px 25px rgba(0,0,0,0.20);
}

.connection-icon{

    display:block;

    font-size:42px;

    margin-bottom:10px;
}

.connection-name{

    display:block;

    font-size:20px;

    font-weight:bold;
}

.connection-description{

    display:block;

    margin-top:7px;

    color:#dbeafe;

    font-size:12px;
}

/* CALCULATOR */

.calculator-screen{

    display:none;
}

.selected-type{

    text-align:center;

    color:white;

    font-size:21px;

    font-weight:bold;

    margin-bottom:20px;
}

.change-btn{

    background:transparent;

    border:1px solid rgba(255,255,255,0.25);

    color:#dbeafe;

    padding:9px 15px;

    width:auto;

    display:block;

    margin:0 auto 20px;

    font-size:13px;

    box-shadow:none;
}

.change-btn:hover{

    transform:none;

    background:rgba(255,255,255,0.10);

    box-shadow:none;
}

.input-box{

    margin-bottom:18px;
}

label{

    display:block;

    color:white;

    margin-bottom:10px;

    font-size:16px;
}

input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    font-size:18px;

    background:#f8fafc;

    outline:none;

    transition:0.3s;
}

input:focus{

    box-shadow:0 0 10px rgba(59,130,246,0.5);
}

.small-note{

    color:#dbeafe;

    font-size:12px;

    margin-top:6px;
}

.calculate-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #00c6ff,
        #0072ff
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:0 0 15px rgba(59,130,246,0.4);
}

.calculate-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(59,130,246,0.4);
}

/* RESULT */

.result-card{

    margin-top:25px;

    background:#22252b;

    border-radius:16px;

    padding:18px;

    animation:fadeIn 0.4s ease;

    overflow-x:auto;

    color:#f1f5f9;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

table{

    width:100%;

    border-collapse:collapse;

    min-width:560px;
}

th{

    color:#f8fafc;

    padding:12px;

    font-size:15px;

    text-align:left;

    border-bottom:1px solid #444850;
}

td{

    padding:12px;

    border-bottom:1px solid #444850;

    font-size:15px;
}

td:last-child{

    text-align:right;

    font-weight:bold;
}

.total-row td{

    border-bottom:none;

    padding-top:18px;
}

.total{

    margin-top:20px;

    padding:18px;

    border-radius:14px;

    text-align:center;

    background:
    linear-gradient(
        135deg,
        #11998e,
        #38ef7d
    );

    color:white;

    font-size:28px;

    font-weight:bold;

    box-shadow:0 8px 20px rgba(16,185,129,0.35);
}

.note{

    margin-top:14px;

    text-align:center;

    color:#cbd5e1;

    font-size:13px;

    line-height:1.7;
}

.footer{

    margin-top:20px;

    text-align:center;
}

.developer{

    color:#dbeafe;

    opacity:0.85;

    line-height:1.7;

    font-size:13px;
}

@media(max-width:520px){

    .title{
        font-size:24px;
    }

    .connection-options{
        grid-template-columns:1fr;
    }

    .connection-btn{
        padding:20px 15px;
    }

    .total{
        font-size:22px;
    }

    .container{
        padding:18px;
    }

}

</style>

</head>

<body>

<div class="bg-glow"></div>

<div class="container">

    <div class="title">
        ⚡ JPDCL Bill Calculator
    </div>

    <div class="subtitle">
        Smart Electricity Bill Estimator
    </div>

    <!-- CONNECTION TYPE SCREEN -->

    <div
        id="connectionScreen"
        class="connection-screen"
    >

        <div class="connection-heading">
            Select Connection Type
        </div>

        <div class="connection-options">

            <button
                class="connection-btn"
                onclick="selectConnection('residential')"
            >

                <span class="connection-icon">
                    🏠
                </span>

                <span class="connection-name">
                    Residential
                </span>

                <span class="connection-description">
                    Household Connection
                </span>

            </button>

            <button
                class="connection-btn"
                onclick="selectConnection('commercial')"
            >

                <span class="connection-icon">
                    🏢
                </span>

                <span class="connection-name">
                    Commercial
                </span>

                <span class="connection-description">
                    Commercial Connection
                </span>

            </button>

        </div>

    </div>


    <!-- CALCULATOR SCREEN -->

    <div
        id="calculatorScreen"
        class="calculator-screen"
    >

        <div
            id="selectedType"
            class="selected-type"
        ></div>

        <button
            class="change-btn"
            onclick="changeConnection()"
        >
            ← Change Connection Type
        </button>

        <div class="input-box">

            <label>
                Enter Units Consumed
            </label>

            <input
                type="number"
                id="units"
                placeholder="Example: 450"
                min="0"
                step="1"
            >

        </div>

        <div class="input-box">

            <label>
                Sanctioned Load (Optional)
            </label>

            <input
                type="number"
                id="load"
                placeholder="Default 2 kW"
                value="2"
                min="0"
                step="0.5"
            >

            <div class="small-note">
                Default value is 2 kW
            </div>

        </div>

        <button
            class="calculate-btn"
            onclick="calculateBill()"
        >
            Calculate Bill
        </button>

        <div id="output"></div>

    </div>


    <div class="footer">

        <span class="developer">
            Developed by Arun Bhagat - bhagat.arun702@gmail.com
        </span>

    </div>

</div>


<script>

let connectionType = "";

function selectConnection(type){

    connectionType = type;

    document.getElementById("connectionScreen")
    .style.display = "none";

    document.getElementById("calculatorScreen")
    .style.display = "block";

    const selectedType =
    document.getElementById("selectedType");

    if(type === "residential"){

        selectedType.innerHTML =
        "🏠 Residential Bill";

    }else{

        selectedType.innerHTML =
        "🏢 Commercial Bill";

    }

    document.getElementById("output").innerHTML = "";

    document.getElementById("units").focus();
}

function changeConnection(){

    connectionType = "";

    document.getElementById("calculatorScreen")
    .style.display = "none";

    document.getElementById("connectionScreen")
    .style.display = "block";

    document.getElementById("output").innerHTML = "";

    document.getElementById("units").value = "";
}

document.getElementById("units")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        calculateBill();
    }

});

function calculateBill(){

    if(!connectionType){

        return;
    }

    const unitsInput =
    document.getElementById("units").value.trim();

    if(unitsInput === ""){

        alert("Please enter units");

        return;
    }

    let units =
    parseFloat(unitsInput);

    if(isNaN(units) || units < 0){

        alert("Please enter valid units");

        return;
    }

    let sanctionedLoad =
    parseFloat(
        document.getElementById("load").value
    );

    if(
        isNaN(sanctionedLoad) ||
        sanctionedLoad < 0
    ){

        sanctionedLoad = 2;
    }

    let energyCharges = 0;

    let fixedCharges = 0;

    let electricityDuty = 0;

    let rows = "";


    /* =========================
       RESIDENTIAL
       ========================= */

    if(connectionType === "residential"){

        let slab1Units =
        Math.min(units, 200);

        let slab2Units = 0;

        let slab3Units = 0;

        let slab1Cost =
        slab1Units * 2.45;

        let slab2Cost = 0;

        let slab3Cost = 0;

        if(units > 200){

            slab2Units =
            Math.min(units - 200, 200);

            slab2Cost =
            slab2Units * 4.20;
        }

        if(units > 400){

            slab3Units =
            units - 400;

            slab3Cost =
            slab3Units * 4.60;
        }

        energyCharges =
        slab1Cost +
        slab2Cost +
        slab3Cost;

        fixedCharges =
        sanctionedLoad * 10;

        electricityDuty =
        energyCharges * 0.15;

        rows = `

        <tr>

            <td>
                Slab 1 (0–200 units)
            </td>

            <td>
                ${slab1Units} × ₹2.45
            </td>

            <td>
                ₹${slab1Cost.toFixed(2)}
            </td>

        </tr>

        <tr>

            <td>
                Slab 2 (201–400 units)
            </td>

            <td>
                ${slab2Units} × ₹4.20
            </td>

            <td>
                ₹${slab2Cost.toFixed(2)}
            </td>

        </tr>

        <tr>

            <td>
                Slab 3 (Above 400 units)
            </td>

            <td>
                ${slab3Units} × ₹4.60
            </td>

            <td>
                ₹${slab3Cost.toFixed(2)}
            </td>

        </tr>

        `;

    }


    /* =========================
       COMMERCIAL
       ========================= */

    if(connectionType === "commercial"){

        let slab1Units =
        Math.min(units, 200);

        let slab2Units =
        Math.max(units - 200, 0);

        let slab1Cost =
        slab1Units * 3.75;

        let slab2Cost =
        slab2Units * 5.70;

        energyCharges =
        slab1Cost +
        slab2Cost;

        fixedCharges =
        sanctionedLoad * 75;

        electricityDuty =
        energyCharges * 0.15;

        rows = `

        <tr>

            <td>
                Slab 1 (First 200 units)
            </td>

            <td>
                ${slab1Units} × ₹3.75
            </td>

            <td>
                ₹${slab1Cost.toFixed(2)}
            </td>

        </tr>

        <tr>

            <td>
                Slab 2 (Remaining ${slab2Units} units)
            </td>

            <td>
                ${slab2Units} × ₹5.70
            </td>

            <td>
                ₹${slab2Cost.toFixed(2)}
            </td>

        </tr>

        `;

    }


    const total =
    energyCharges +
    fixedCharges +
    electricityDuty;


    const connectionName =
    connectionType === "residential"
    ? "Residential"
    : "Commercial";


    document.getElementById("output").innerHTML = `

    <div class="result-card">

        <table>

            <tr>

                <th>
                    Component
                </th>

                <th>
                    Calculation
                </th>

                <th>
                    Amount
                </th>

            </tr>

            ${rows}

            <tr>

                <td>
                    <strong>
                        Total Energy Charges (A)
                    </strong>
                </td>

                <td>
                    Energy Charges
                </td>

                <td>
                    ₹${energyCharges.toFixed(2)}
                </td>

            </tr>

            <tr>

                <td>
                    <strong>
                        Fixed Charges (B)
                    </strong>
                </td>

                <td>
                    ${sanctionedLoad} kW × ₹${connectionType === "commercial" ? "75" : "10"}
                </td>

                <td>
                    ₹${fixedCharges.toFixed(2)}
                </td>

            </tr>

            <tr>

                <td>
                    <strong>
                        Electricity Duty (C)
                    </strong>
                </td>

                <td>
                    15% of ₹${energyCharges.toFixed(2)}
                </td>

                <td>
                    ₹${electricityDuty.toFixed(2)}
                </td>

            </tr>

            <tr class="total-row">

                <td>
                    <strong>
                        Total Estimated Bill
                    </strong>
                </td>

                <td>
                    A + B + C
                </td>

                <td>
                    <strong>
                        ₹${total.toFixed(2)}
                    </strong>
                </td>

            </tr>

        </table>


        <div class="total">

            💰 Estimated ${connectionName} Bill

            <br>

            ₹${total.toLocaleString("en-IN", {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            })}

        </div>


        <div class="note">

            Energy Charges (A) =
            ₹${energyCharges.toFixed(2)}

            <br>

            Fixed Charges (B) =
            ₹${fixedCharges.toFixed(2)}

            <br>

            Electricity Duty (C) =
            ₹${electricityDuty.toFixed(2)}

            <br><br>

            Actual bill may vary due to
            arrears, adjustments, taxes,
            subsidies or other applicable charges.

            <br><br>

            This is an unofficial bill
            estimator and is not affiliated
            with JPDCL.

        </div>

    </div>

    `;

}

</script>

</body>

</html>
